name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: "Build ZIP e pubblica Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verifica coerenza versione tag / plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9.]+' db-role-ux.php)
          CONST=$(grep -oP "define\(\s*'DB_ROLE_UX_VERSION',\s*'\K[0-9.]+" db-role-ux.php)
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::La versione del tag ($TAG) non coincide con quella del plugin (header: $HEADER, DB_ROLE_UX_VERSION: $CONST)."
            exit 1
          fi

      - name: Build ZIP
        # git archive rispetta gli export-ignore in .gitattributes e imposta
        # la cartella radice 'db-role-ux/' (necessaria a WordPress: lo zip
        # auto-generato da GitHub avrebbe 'db-role-ux-x.y.z/').
        run: |
          git archive --format=zip --prefix=db-role-ux/ \
            -o "db-role-ux-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"
          unzip -l "db-role-ux-${GITHUB_REF_NAME#v}.zip"
          # Nessun file di sviluppo nel pacchetto distribuito.
          if unzip -l "db-role-ux-${GITHUB_REF_NAME#v}.zip" | grep -E 'db-role-ux/(tests|bin|node_modules|vendor|\.github)|package(-lock)?\.json|composer\.json|phpunit|phpcs|playwright|\.wp-env|TESTING'; then
            echo "::error::Lo ZIP contiene file di sviluppo."
            exit 1
          fi

      - name: Crea/aggiorna Release con lo ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: db-role-ux-*.zip
          generate_release_notes: true
